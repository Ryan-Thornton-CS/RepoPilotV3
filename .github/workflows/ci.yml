name: Verify RepoPilotV3
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      failed_extensions_only:
        description: Retry Linux stable and both Windows extension jobs without Python/package/legacy Linux
        type: boolean
        default: false
      artifact_run_id:
        description: Successful package run to reuse (required for failed-extensions-only)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  python:
    if: ${{ !inputs.failed_extensions_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: uv sync --frozen --group dev --extra csharp
      - name: Explicit synthetic dependency provisioning
        run: uv run --frozen python tools/provision_fixtures.py --dotnet dotnet
      - run: uv run --frozen ruff check src tests tools examples
      - run: uv run --frozen pytest -q
  package:
    if: ${{ !inputs.failed_extensions_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: uv sync --frozen --group dev
      - run: npm ci --prefix extension --ignore-scripts
      - run: uv run --frozen python tools/build.py
      - run: uv run --frozen python tools/verify.py --smoke
      - run: uv run --frozen python tools/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: repopilotv3-vsix
          path: dist/*.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: repopilotv3-distribution
          path: |
            dist/repopilotv3-*-release.zip
            dist/SHA256SUMS
  extension:
    if: ${{ !cancelled() && ((inputs.failed_extensions_only && inputs.artifact_run_id != '') || needs.package.result == 'success') }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.failed_extensions_only && '[{"os":"ubuntu-latest","editor":"stable"},{"os":"windows-latest","editor":"1.85.2"},{"os":"windows-latest","editor":"stable"}]' || '[{"os":"ubuntu-22.04","editor":"1.85.2"},{"os":"ubuntu-latest","editor":"stable"},{"os":"windows-latest","editor":"1.85.2"},{"os":"windows-latest","editor":"stable"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repopilotv3-vsix
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: uv sync --frozen --group dev
      - run: npm ci --prefix extension --ignore-scripts
      - name: Extract the same release for both native hosts
        run: uv run --frozen python -c "import pathlib,zipfile; zipfile.ZipFile(next(pathlib.Path('dist').glob('*.vsix'))).extractall('.')"
      - run: npm test --prefix extension
      - run: uv run --frozen python tools/verify.py --smoke
      - name: Editor checks (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:editor
        working-directory: extension
        env:
          VSCODE_TEST_VERSION: ${{ matrix.editor }}
      - name: Editor checks (Windows)
        if: runner.os == 'Windows'
        run: npm run test:editor
        working-directory: extension
        env:
          VSCODE_TEST_VERSION: ${{ matrix.editor }}
      - name: Preserve editor failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-logs-${{ matrix.os }}-${{ matrix.editor }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            extension/.vscode-test/repopilot-logs/**
            extension/.vscode-test/editor-result.json
