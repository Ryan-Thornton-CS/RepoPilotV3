[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "repopilotv3"
version = "0.2.13"
description = "Static Copilot harness and a VS Code manual WebUI workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastmcp>=2.14,<4", "jsonschema>=4.23,<5", "watchdog>=6,<7"]

[project.optional-dependencies]
csharp = ["pythonnet>=3.0.5,<4"]

[dependency-groups]
bundle = ["pytest>=8,<10"]
dev = ["packaging>=26,<27", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "build>=1,<2", "pyyaml>=6,<7"]

[project.scripts]
repopilotv3 = "repopilotv3.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilotv3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel.force-include]
"harness" = "repopilotv3/harness"

[tool.hatch.build.targets.sdist]
include = ["/src", "/harness", "/tests", "/tools", "/docs", "/examples", "/extension", "/README.md", "/pyproject.toml", "/uv.lock"]
exclude = ["/extension/node_modules", "/extension/out", "/extension/harness", "/extension/.vscode-test", "/extension/backend", "/extension/docs", "/extension/README.md", "/extension/LICENSE"]
